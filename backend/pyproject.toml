[project]
name = "audio-transcriber-backend"
version = "0.1.0"
description = "Audio transcription backend API"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt==4.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.136.3",
    "google-auth>=2.54.0",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.29",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.48.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "mypy>=1.2.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
